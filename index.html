<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Shipping Label</title>

<style>
@page {
  size: A5 portrait;
  margin: 6mm;
}

body {
  font-family: Arial, sans-serif;
  margin: 0;
  font-size: 12px;
}

.label {
  border: 1px solid #000;
  padding: 8px;
}

/* TOP */
.top-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.awb {
  font-weight: bold;
  font-size: 13px;
}

.barcode img {
  height: 50px;
}

/* INFO */
.info-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px 10px;
  margin-top: 8px;
}

/* ADDRESS */
.address-row {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

.block {
  flex: 1;
  border: 1px solid #000;
  padding: 6px;
}

.title {
  font-weight: bold;
  margin-bottom: 4px;
}

.big {
  font-weight: bold;
}

/* TABLE */
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 6px;
}

table, th, td {
  border: 1px solid #000;
}

th, td {
  padding: 4px;
}

/* SUMMARY */
.summary {
  display: flex;
  justify-content: space-between;
  margin-top: 6px;
}
</style>
</head>

<body>

<div class="label">

  <!-- TOP -->
  <div class="top-row">
    <div>
      <div>AWB / Tracking Number</div>
      <div id="awb" class="awb"></div>
    </div>

    <div class="barcode">
      <img id="barcode">
    </div>
  </div>

  <!-- INFO -->
  <div class="info-grid">
  <div>Courier</div><div id="courier"></div>
  <div>Payment Mode</div><div id="payment_mode"></div>
  <div>Ship Date</div><div id="ship_date"></div>
  <div>Order ID</div><div id="order_id"></div>
  <div>Invoice No</div><div id="invoice_number"></div>
  <div>Boxes</div><div id="boxes"></div>
  <div>Weight</div><div id="weight"></div>
</div>

  <!-- ADDRESS -->
  <div class="address-row">
    <div class="block">
      <div class="title">Ship To</div>
      <div class="big" id="customer_name"></div>
      <div id="full_address"></div>
      <div>Contact: <span id="contact"></span></div>
      <div><b>Pincode:</b> <span id="pincode" style="font-weight:bold;"></span></div>
    </div>

    <div class="block">
      <div class="title">From</div>
      <div>GNV Commodities Pvt. Ltd.</div>
      <div id="shipping_address"></div>
      <div>Contact: <span id="shipper_contact"></span></div>
    </div>
  </div>

  <!-- CONTENTS -->
   <br>
  <div class="title">Contents</div>
  <table id="items_table">
    <thead>
      <tr>
        <th>Item</th>
        <th style="text-align:right;">Qty</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <!-- TOTAL -->
  <div class="summary">
    <div>Total Invoice Value</div>
    <div id="invoice_value"></div>
  </div>

  <div class="summary">
  <div><b>Collectable Value</b></div>
  <div id="collectable_value" style="font-weight:bold;"></div>
</div>

  <!-- PACKAGE -->
  <!-- <div class="summary">
    <div>Boxes</div>
    <div id="boxes"></div>
  </div>

  <div class="summary">
    <div>Weight</div>
    <div id="weight"></div>
  </div> -->

</div>

<script>
try {

  const params = new URLSearchParams(window.location.search);
  const raw = params.get("data");

  let data = {};
  if (raw) {
    data = JSON.parse(decodeURIComponent(raw));
  }

  function set(id, val) {
    const el = document.getElementById(id);
    if (el) el.innerText = val || "N/A";
  }

  function formatINR(val) {
    if (!val) return "0";
    return Number(val).toLocaleString("en-IN");
  }

  // BASIC
  set("awb", data.awb);
  set("courier", data.courier);
  set("payment_mode", data.payment_mode);
  set("ship_date", data.ship_date);
  set("order_id", data.order_id);
  set("invoice_number", data.invoice_number);

  set("customer_name", data.customer_name);
  set("full_address", data.full_address);
  set("contact", data.contact);
  set("pincode", data.pincode);

  set("shipping_address", data.shipping_address);
  set("shipper_contact", data.shipper_contact);

  set("invoice_value", formatINR(data.invoice_value));
  set("collectable_value", formatINR(data.collectable_value));

  set("boxes", data.boxes);
  set("weight", data.weight ? data.weight + " Kg" : "N/A");

  // BARCODE
  if (data.awb) {
    document.getElementById("barcode").src =
      "https://barcode.tec-it.com/barcode.ashx?data=" +
      data.awb + "&code=Code128";
  }

  // CONTENT TABLE
  const items = (data.contents || "").split(",");
  const tbody = document.querySelector("#items_table tbody");

  items.forEach(i => {
    if (!i.trim()) return;

    const parts = i.split(":");
    const name = parts[0]?.trim();
    const qty = parts[1]?.trim();

    tbody.innerHTML += `
      <tr>
        <td>${name}</td>
        <td style="text-align:right">${qty}</td>
      </tr>
    `;
  });

  // PRINT
  window.onload = function () {
    setTimeout(() => {
      window.print();
    }, 500);
  };

} catch (e) {
  console.error("LABEL ERROR:", e);
}
</script>

</body>
</html>
