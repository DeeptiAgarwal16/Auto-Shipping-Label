<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Shipping Label</title>

<style>
@page {
  size: A5 portrait;
  margin: 6mm;
}

body {
  font-family: Arial, sans-serif;
  margin: 0;
  font-size: 12px;
}

.label {
  border: 1px solid #000;
  padding: 8px;
  page-break-after: always;
}

/* TOP */
.top-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.awb {
  font-weight: bold;
  font-size: 13px;
}

.barcode img {
  height: 50px;
}

/* INFO */
.info-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px 10px;
  margin-top: 8px;
}

/* ADDRESS */
.address-row {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

.block {
  flex: 1;
  border: 1px solid #000;
  padding: 6px;
}

.title {
  font-weight: bold;
  margin-bottom: 4px;
}

.big {
  font-weight: bold;
}

/* TABLE */
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 6px;
}

table, th, td {
  border: 1px solid #000;
}

th, td {
  padding: 4px;
}

/* SUMMARY */
.summary {
  display: flex;
  justify-content: space-between;
  margin-top: 6px;
}

.barcode-center {
  text-align: center;
  margin-top: 6px;
}

.barcode-center img {
  height: 50px;
}
</style>
</head>

<body>

<div id="labels_container"></div>

<script>
try {

  const params = new URLSearchParams(window.location.search);
  const raw = params.get("data");

  let data = {};
  if (raw) {
    data = JSON.parse(decodeURIComponent(raw));
  }

  const container = document.getElementById("labels_container");

  function formatINR(val) {
    if (!val) return "0";
    return Number(val).toLocaleString("en-IN");
  }

  function isCOD(mode) {
    if (!mode) return false;
    mode = mode.toLowerCase();
    return mode.includes("cash on delivery") || mode.includes("cheque on delivery");
  }

  function generateLabel(boxIndex, totalBoxes) {

    const div = document.createElement("div");
    div.className = "label";

    div.innerHTML = `
      <div class="top-row">
      <div>
        <div>AWB / Tracking Number</div>
        <div class="awb">${data.awb || ""}</div>
      </div>

      <div style="font-weight:bold; text-align:right;">
        Box ${boxIndex}/${totalBoxes}
      </div>
    </div>

    <!-- BARCODE CENTERED -->
    <div class="barcode-center">
      <img src="https://barcode.tec-it.com/barcode.ashx?data=${data.awb}&code=Code128">
    </div>

      <div class="info-grid">
        <div>Courier</div><div>${data.courier || ""}</div>
        <div>Payment Mode</div><div>${data.payment_mode || ""}</div>
        <div>Ship Date</div><div>${data.ship_date || ""}</div>
        <div>Order ID</div><div>${data.order_id || ""}</div>
        <div>Invoice No</div><div>${data.invoice_number || ""}</div>
        <div>Boxes</div><div>${totalBoxes}</div>
        <div>Weight</div><div>${data.weight ? data.weight + " Kg" : ""}</div>
      </div>

      <!-- ADDRESS (FROM LEFT, SHIP TO RIGHT) -->
      <div class="address-row">
        <div class="block">
          <div class="title">From</div>
          <div>GNV Commodities Pvt. Ltd.</div>
          <div>${data.shipping_address || ""}</div>
          <div>Contact: ${data.shipper_contact || ""}</div>
        </div>

        <div class="block">
          <div class="title">Ship To</div>
          <div class="big">${data.customer_name || ""}</div>
          <div>${data.full_address || ""}</div>
          <div>Contact: ${data.contact || ""}</div>
          <div><b>Pincode:</b> <span style="font-weight:bold;">${data.pincode || ""}</span></div>
        </div>
      </div>

      <div class="title">Contents</div>
      <table>
        <thead>
          <tr>
            <th>Item</th>
            <th style="text-align:right;">Qty</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Pet Food / Accessories</td>
            <td style="text-align:right">${data.quantity || "0"}</td>
          </tr>
        </tbody>
      </table>

      <div class="summary">
        <div>Total Invoice Value</div>
        <div>${formatINR(data.invoice_value)}</div>
      </div>

      ${
        isCOD(data.payment_mode) ? `
        <div class="summary">
          <div><b>Collectable Value</b></div>
          <div style="font-weight:bold;">${formatINR(data.collectable_value)}</div>
        </div>
        ` : ""
      }

    `;

    return div;
  }

  const totalBoxes = Number(data.boxes) || 1;

  for (let i = 1; i <= totalBoxes; i++) {
    container.appendChild(generateLabel(i, totalBoxes));
  }

  // AUTO PRINT
  window.onload = function () {
    setTimeout(() => {
      window.print();
    }, 600);
  };

} catch (e) {
  console.error("LABEL ERROR:", e);
}
</script>

</body>
</html>
