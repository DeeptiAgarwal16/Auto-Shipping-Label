<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Shipping Label</title>

<style>
  @page {
    size: A5 portrait;
    margin: 6mm;
  }

  body {
    font-family: Arial, sans-serif;
    margin: 0;
    font-size: 12px;
  }

  .label {
    border: 1px solid #000;
    padding: 8px;
  }

  .header {
    text-align: center;
    font-weight: bold;
    font-size: 16px;
    border-bottom: 1px solid #000;
    padding-bottom: 4px;
    margin-bottom: 6px;
  }

  .section {
    border-bottom: 1px solid #000;
    padding: 6px 0;
  }

  .row {
    display: flex;
    justify-content: space-between;
    margin: 2px 0;
  }

  .left { width: 50%; }
  .right { width: 50%; text-align: right; }

  .block {
    border: 1px solid #000;
    padding: 6px;
    margin-top: 4px;
  }

  .title {
    font-weight: bold;
    margin-bottom: 4px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 11px;
  }

  table, th, td {
    border: 1px solid #000;
  }

  th, td {
    padding: 4px;
    text-align: left;
  }

  .barcode {
    text-align: center;
    margin-top: 5px;
  }

  .big {
    font-weight: bold;
    font-size: 14px;
  }
</style>
</head>

<body>

<div class="label">

  <div class="header">SHIPPING LABEL</div>

  <!-- AWB -->
  <div class="section">
    <div class="row">
      <div class="left">AWB / Tracking Number</div>
      <div class="right big" id="awb"></div>
    </div>
    <div class="barcode">
      <img id="barcode">
    </div>
  </div>

  <!-- Shipment Info -->
  <div class="section">
    <div class="row"><div>Courier</div><div id="courier"></div></div>
    <div class="row"><div>Payment Mode</div><div id="payment_mode"></div></div>
    <div class="row"><div>Ship Date</div><div id="ship_date"></div></div>
    <div class="row"><div>Order ID</div><div id="order_id"></div></div>
    <div class="row"><div>Invoice No</div><div id="invoice_number"></div></div>
  </div>

  <!-- Addresses -->
  <div class="section">
    <div class="block">
      <div class="title">From</div>
      <div id="shipping_address"></div>
      <div>Contact: <span id="shipper_contact"></span></div>
    </div>

    <div class="block">
      <div class="title">Ship To</div>
      <div class="big" id="customer_name"></div>
      <div id="full_address"></div>
      <div>Contact: <span id="contact"></span></div>
      <div><b>Pincode: </b><span id="pincode"></span></div>
    </div>
  </div>

  <!-- Contents Table -->
  <div class="section">
    <div class="title">Contents</div>
    <table id="items_table">
      <thead>
        <tr>
          <th>Item</th>
          <th style="text-align:right;">Qty</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- Pricing -->
  <div class="section">
    <div class="row"><div>Sub Total</div><div id="sub_total"></div></div>
    <div class="row"><div>Tax (GST)</div><div id="tax"></div></div>
    <div class="row"><div>Total Invoice Value</div><div id="invoice_value"></div></div>
    <div class="row"><div><b>Collectable Value</b></div><div id="collectable_value"><b></b></div></div>
  </div>

  <!-- Package -->
  <div class="section">
    <div class="row"><div>Boxes</div><div id="boxes"></div></div>
    <div class="row"><div>Weight</div><div id="weight"></div></div>
  </div>

</div>

<script>
/* ---------------- GET DATA ---------------- */
const params = new URLSearchParams(window.location.search);
const raw = params.get("data");
const data = JSON.parse(decodeURIComponent(raw));

function set(id, val) {
  document.getElementById(id).innerText = val || "N/A";
}

/* ---------------- BASIC FIELDS ---------------- */
set("awb", data.awb);
set("courier", data.courier);
set("payment_mode", data.payment_mode);
set("ship_date", data.ship_date);
set("order_id", data.order_id);
set("invoice_number", data.invoice_number);
set("customer_name", data.customer_name);
set("full_address", data.full_address);
set("contact", data.contact);
set("pincode", data.pincode);
set("shipping_address", data.shipping_address);
set("shipper_contact", data.shipper_contact);
set("sub_total", data.sub_total);
set("tax", data.tax);
set("invoice_value", data.invoice_value);
set("collectable_value", data.collectable_value);
set("boxes", data.boxes);
set("weight", data.weight + " Kg");

/* ---------------- BARCODE ---------------- */
document.getElementById("barcode").src =
  "https://barcode.tec-it.com/barcode.ashx?data=" +
  data.awb + "&code=Code128";

/* ---------------- CONTENTS TABLE ---------------- */
/* Expected format: "Item1: 2, Item2: 1, ..." */
const items = data.contents.split(",");
const tbody = document.querySelector("#items_table tbody");

items.forEach(i => {
  if(i.trim() === "") return;

  const parts = i.split(":");
  const name = parts[0]?.trim();
  const qty = parts[1]?.trim();

  const tr = document.createElement("tr");

  const td1 = document.createElement("td");
  td1.innerText = name;

  const td2 = document.createElement("td");
  td2.innerText = qty;
  td2.style.textAlign = "right";

  tr.appendChild(td1);
  tr.appendChild(td2);
  tbody.appendChild(tr);
});

/* ---------------- AUTO PRINT ---------------- */
window.onload = function () {
  setTimeout(() => {
    window.focus();
    window.print();
  }, 700);
};
</script>

</body>
</html>
